name: Build CortaViral AI APK

on:
  push:
    branches: [ main ]
    paths:
      - '.android-source/**'
      - 'scripts/**'
      - 'app.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'render.yaml'
      - 'README.md'
      - 'static/**'
      - 'streamlit_app.py'
      - 'requirements-streamlit.txt'
      - 'tests/**'
      - '.devcontainer/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax and HTML bindings
        run: |
          node --check static/app.js
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("static/index.html").read_text(encoding="utf-8")
          js = Path("static/app.js").read_text(encoding="utf-8")
          required = set(re.findall(r'\$\("([A-Za-z][A-Za-z0-9]+)"\)', js))
          required.discard("appToast")
          present = set(re.findall(r'\bid="([^"]+)"', html))
          missing = sorted(required - present)
          assert not missing, f"HTML is missing IDs used by JavaScript: {missing}"
          print(f"HTML/JS binding check OK ({len(required)} IDs)")
          PY
      - name: Check backend syntax and API health
        run: |
          python -m pip install fastapi pydantic python-multipart
          python -m py_compile app.py streamlit_app.py tests/test_streamlit_engine.py
          python - <<'PY'
          import app
          h = app.health()
          assert h["ok"] and h["app"] == "CortaViral AI" and h["version"] == "2.1"
          assert h["clip_duration_seconds"] == {"minimum": 30, "maximum": 90}
          assert h["upload_endpoint"] == "/api/analyze-upload"
          assert h["url_endpoint"] == "/api/analyze"
          request = app.AnalyzeRequest(url="https://example.com/video.mp4")
          assert request.subtitles is True and request.min_duration == 30 and request.max_duration == 90
          assert h["configurable_clip_duration_seconds"] == {"minimum": 30, "maximum": 90}
          assert "visual_activity_analysis" in h["features"]
          for duration in (60, 61, 100, 181, 5400):
              custom = app.candidates([], duration, 45, 60)
              assert custom, f"No custom-duration windows for source duration {duration}"
              assert all(45 <= x["end"] - x["start"] <= 60 for x in custom)
          samples = [{"time": 4.0, "score": 0.08}, {"time": 8.0, "score": 0.12}]
          assert app.visual_window_score(samples, 0, 10) > 0
          routes = {route.path for route in app.app.routes}
          assert {"/api/health", "/api/analyze", "/api/analyze-upload", "/api/jobs/{job}"} <= routes
          for duration in (30, 31, 59, 90, 91, 100, 181, 5400):
              windows = app.candidates([], duration)
              assert windows, f"No windows for source duration {duration}"
              assert all(30 <= x["end"] - x["start"] <= 90 for x in windows)
          from pathlib import Path
          from tempfile import TemporaryDirectory
          original_work = app.WORK
          try:
              with TemporaryDirectory() as temporary:
                  app.WORK = Path(temporary)
                  app.JOBS.clear()
                  app.update("abc123def456", status="completed", results=[])
                  app.JOBS.clear()
                  restored = app.read_job("abc123def456")
                  assert restored and restored["status"] == "completed"
          finally:
              app.WORK = original_work
          print("API contract, HTML bindings, upload, subtitles, job persistence and clip windows OK")
          PY

  streamlit-engine-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated Streamlit media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-streamlit.txt
      - name: Test MoviePy 2 media pipeline
        run: |
          python -m py_compile streamlit_app.py tests/test_streamlit_engine.py
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("streamlit_engine_test", "tests/test_streamlit_engine.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.test_moviepy_v2_video_pipeline()
          print("MoviePy 2 pipeline: synthetic video, 30–90s windows, crop, subtitles and MP4 export OK")
          PY

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble Android project archive
        run: |
          cat .android-source/part-01.b64 .android-source/part-02.b64 .android-source/part-03.b64 .android-source/part-04.b64 .android-source/part-05.b64 .android-source/part-06.b64 .android-source/part-07.b64 .android-source/part-08a.b64 .android-source/part-08b.b64 .android-source/part-08c.b64 .android-source/part-09a.b64 .android-source/part-09b.b64 | base64 --decode > android-source.zip
          unzip -t android-source.zip
          mkdir -p android
          unzip -q android-source.zip -d android
      - name: Apply API response validation fix
        run: |
          cat .android-source/android-patch-01.b64 .android-source/android-patch-02.b64 .android-source/android-patch-03.b64 | base64 --decode > android-java-patch.zip
          unzip -t android-java-patch.zip
          unzip -oq android-java-patch.zip -d android
      - name: Atualizar interface multiplataforma e validar servidor no app
        run: python scripts/patch_android.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Package Android source for inspection
        if: always()
        run: |
          mkdir -p inspection
          cp -R android/app/src inspection/src
          cp android/app/build.gradle inspection/ 2>/dev/null || true
          cp android/build.gradle inspection/ 2>/dev/null || true
          cd inspection && zip -qr ../android-source-inspection.zip .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cortaviral-android-source-inspection
          path: android-source-inspection.zip
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: cortaviral-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
